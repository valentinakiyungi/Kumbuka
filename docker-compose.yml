# docker compose up  ->  http://localhost:8000
services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"   # Qdrant dashboard at http://localhost:6333/dashboard

  app:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - app_data:/app/data      # conversations (SQLite)
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
  app_data:
